<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cloud Server Health Checker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #1f2937;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 25px;
            color: #6b7280;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .history-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .history-link:hover {
            text-decoration: underline;
        }

        .footer-text {
            margin-top: 25px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .container {
                width: calc(100% - 30px);
                margin: 30px auto;
                padding: 22px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Cloud Server Health Checker</h1>

        <p class="subtitle">
            Check server health using CPU usage and current server status.
        </p>

        <form action="health-check" method="post">

            <div class="form-group">
                <label for="serverName">Server Name</label>

                <input
                    type="text"
                    id="serverName"
                    name="serverName"
                    placeholder="Example: web-server-01"
                    required
                >
            </div>

            <div class="form-group">
                <label for="cpuUsage">CPU Usage (%)</label>

                <input
                    type="number"
                    id="cpuUsage"
                    name="cpuUsage"
                    min="0"
                    max="100"
                    placeholder="Example: 75"
                    required
                >
            </div>

            <div class="form-group">
                <label for="serverStatus">Server Status</label>

                <select
                    id="serverStatus"
                    name="serverStatus"
                >
                    <option value="Running">Running</option>
                    <option value="Stopped">Stopped</option>
                </select>
            </div>

            <button type="submit">
                Check Health
            </button>

        </form>

        <a href="history" class="history-link">
            View Health History
        </a>

        <p class="footer-text">
            Java Servlet • Apache Tomcat • MySQL
        </p>

    </div>

</body>
</html>
